esphome:
  name: gree-sniffer-orange
  friendly_name: "Gree sniffer orange"

esp8266:
  board: d1_mini

logger:
  baud_rate: 0
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# RX only. GPIO12/D6 intentionally avoids the D1 Mini USB-UART circuit on GPIO3.
uart:
  id: sniff_uart
  rx_pin: GPIO12
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 512

external_components:
  - source: github://vsebastiaan/esphome_gree_ac@main
    components: [gree_sniffer]

gree_sniffer:
  id: orange_sniffer
  uart_id: sniff_uart
  channel: "ORANGE module-TX -> AC-RX"
