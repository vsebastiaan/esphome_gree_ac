# Live-control test for Tosot GWH18AAD-K6DNA1B/I on a Wemos D1 mini.
#
# FINAL HARDWARE VERIFIED ON THE TEST UNIT
#
# AC -> D1 RX:
#   ORANGE (AC TX) -> 22k -> base 2N3904
#   2N3904 emitter -> BROWN/GND
#   2N3904 collector -> GPIO3 / D1 RX
#   GPIO3 / collector -> 10k -> 3.3V
#
# D1 TX -> AC:
#   GPIO1 / D1 TX -> 4.7k -> base 2N3904
#   2N3904 emitter -> BROWN/GND
#   2N3904 collector -> BLACK (AC RX)
#
# Both directions are inverted by the NPN stages, so both UART pins are
# configured inverted in software.
#
# The earlier 4.7k/10k RX divider + D5 startup-kick experiment is NOT needed
# with this transistor RX interface. The transistor interface fixed cold-start
# RX immediately on the tested GWH18.
#
# Normal GWH18 controls are auto-created. Unverified family-level functions
# remain opt-in so they do not clutter a normal Homey/ESPHome device.

esphome:
  name: airco-huiskamer
  friendly_name: "Airco huiskamer"

esp8266:
  board: d1_mini

logger:
  baud_rate: 0
  level: DEBUG

api:
  encryption:
    key: "REPLACE_WITH_YOUR_API_KEY"

ota:
  - platform: esphome
    password: "REPLACE_WITH_YOUR_OTA_PASSWORD"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: ac_uart
  tx_pin:
    number: GPIO1
    inverted: true
  rx_pin:
    number: GPIO3
    inverted: true
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 512

external_components:
  - source:
      type: git
      url: https://github.com/vsebastiaan/esphome_gree_ac
      ref: feature/tosot-v5-full-mapping
    components: [tosot_ac]
    refresh: 0s

climate:
  - platform: tosot_ac
    id: tosot_huiskamer
    name: "Airco huiskamer"
    uart_id: ac_uart

    # Optional controlled tests. Uncomment only when you want to investigate
    # these family-level mappings on real hardware.
    # save_select:
    #   name: "TEST - Save / Eco"
    # xfan_select:
    #   name: "TEST - X-Fan"
    # plasma_select:
    #   name: "TEST - Health / Plasma"
    # beeper_select:
    #   name: "TEST - Beeper"

# Auto-created entities:
#   Ventilatorsnelheid    Automatisch / Laag / Midden / Hoog / Turbo
#   Verticale lamel       Swing / Hoogste / Hoog / Midden / Laag / Laagste
#   Display               Uit / Aan
#   Slaapstand            Uit / Aan
#
# Homey localises the standard climate modes to Dutch, e.g.:
#   Automatisch / Koelen / Verwarmen / Ontvochtigen / Alleen ventileren / Uit
#
# Opt-in test entities:
#   TEST - Save / Eco      AC acknowledges; actual energy effect not yet proven
#   TEST - X-Fan           expected coil-dry function after COOL/DRY shutdown
#   TEST - Health / Plasma AC acknowledges; fitted hardware/effect unknown
#   TEST - Beeper          no useful effect observed on the tested GWH18
