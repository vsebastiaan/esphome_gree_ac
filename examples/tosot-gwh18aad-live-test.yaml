# Live-control test for Tosot GWH18AAD-K6DNA1B/I on a Wemos D1 mini.
# Confirmed wiring for this unit:
#   GPIO1/TX -> 4.7k -> base 2N3904; emitter -> GND; collector -> BLACK (AC RX)
#   ORANGE (AC TX) -> 4.7k -> RX node -> GPIO3
#   RX node -> 10k -> GND
#   GPIO14 / D5 -> 4.7k -> RX node   (short automatic startup/recovery kick)
#   BROWN -> GND
#
# TX is inverted in software because the NPN transistor inverts it.
# D5 is normally high-impedance. The driver drives it HIGH for 100 ms at boot,
# then releases it. If no valid 2F/31 report arrives it retries after 2 seconds;
# after communication is established it only retries after a 5-second RX timeout.

esphome:
  name: airco-huiskamer
  friendly_name: "Airco huiskamer"

esp8266:
  board: d1_mini

logger:
  baud_rate: 0
  level: INFO

api:
  encryption:
    key: "REPLACE_WITH_YOUR_API_KEY"

ota:
  - platform: esphome
    password: "REPLACE_WITH_YOUR_OTA_PASSWORD"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: ac_uart
  tx_pin:
    number: GPIO1
    inverted: true
  rx_pin: GPIO3
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 512

external_components:
  - source: github://vsebastiaan/esphome_gree_ac@main
    components: [tosot_ac]
    refresh: 0s

climate:
  - platform: tosot_ac
    id: tosot_huiskamer
    name: "Airco huiskamer"
    uart_id: ac_uart
    kick_pin: GPIO14
