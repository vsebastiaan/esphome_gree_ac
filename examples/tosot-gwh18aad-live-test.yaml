# Live-control test for Tosot GWH18AAD-K6DNA1B/I on a Wemos D1 mini.
# Confirmed wiring for this unit:
#   GPIO1/TX -> 4.7k -> base 2N3904; emitter -> GND; collector -> BLACK (AC RX)
#   ORANGE (AC TX) -> 4.7k -> RX node -> GPIO3
#   RX node -> 10k -> GND
#   RX node -> 47k -> 3V3
#   BROWN -> GND
# TX is inverted in software because the NPN transistor inverts it.

esphome:
  name: airco-huiskamer
  friendly_name: "Airco huiskamer"

esp8266:
  board: d1_mini

logger:
  baud_rate: 0
  level: VERBOSE

api:
  encryption:
    key: "REPLACE_WITH_YOUR_API_KEY"

ota:
  - platform: esphome
    password: "REPLACE_WITH_YOUR_OTA_PASSWORD"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: ac_uart
  tx_pin:
    number: GPIO1
    inverted: true
  rx_pin: GPIO3
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 512

external_components:
  - source: github://vsebastiaan/esphome_gree_ac@main
    components: [sinclair_ac]
    refresh: 0s

climate:
  - platform: sinclair_ac
    id: tosot_huiskamer
    name: "Airco huiskamer"
    uart_id: ac_uart
