# Live-control test for Tosot GWH18AAD-K6DNA1B/I on a Wemos D1 mini.
#
# Confirmed wiring for this unit:
#   GPIO1/TX -> 4.7k -> base 2N3904; emitter -> GND; collector -> BLACK (AC RX)
#   ORANGE (AC TX) -> 4.7k -> RX node -> GPIO3/D1 RX
#   RX node -> 10k -> GND
#   GPIO14 / D5 -> series resistor -> RX node (startup RX kick experiment)
#   BROWN -> GND
#
# The component auto-creates the normal GWH18 controls and EXP test switches,
# so the climate block intentionally stays minimal.

esphome:
  name: airco-huiskamer
  friendly_name: "Airco huiskamer"

esp8266:
  board: d1_mini

logger:
  baud_rate: 0
  level: DEBUG

api:
  encryption:
    key: "REPLACE_WITH_YOUR_API_KEY"

ota:
  - platform: esphome
    password: "REPLACE_WITH_YOUR_OTA_PASSWORD"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: ac_uart
  tx_pin:
    number: GPIO1
    inverted: true
  rx_pin: GPIO3
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 512

external_components:
  - source:
      type: git
      url: https://github.com/vsebastiaan/esphome_gree_ac
      ref: 4ada457f8dbda5109ddd2b8af3125803c242a6ce
    components: [tosot_ac]
    refresh: 0s

climate:
  - platform: tosot_ac
    id: tosot_huiskamer
    name: "Airco huiskamer"
    uart_id: ac_uart
    kick_pin: GPIO14

# Auto-created entities:
#   Fan snelheid          Auto / Laag / Midden / Hoog
#   Verticale lamel       Swing / Hoogste / Hoog / Midden / Laag / Laagste
#   Display               Uit / Aan
#   EXP - Turbo
#   EXP - Sleep
#   EXP - X-Fan
#   EXP - Save / Eco
#   EXP - Health / Plasma
#   EXP - Beeper
