# Live-control test for Tosot GWH18AAD-K6DNA1B/I on a Wemos D1 mini.
#
# FINAL HARDWARE VERIFIED ON THE TEST UNIT
#
# AC -> D1 RX:
#   ORANGE (AC TX) -> 22k -> base 2N3904
#   2N3904 emitter -> BROWN/GND
#   2N3904 collector -> GPIO3 / D1 RX
#   GPIO3 / collector -> 10k -> 3.3V
#
# D1 TX -> AC:
#   GPIO1 / D1 TX -> 4.7k -> base 2N3904
#   2N3904 emitter -> BROWN/GND
#   2N3904 collector -> BLACK (AC RX)
#
# Both directions are inverted by the NPN stages, so both UART pins are
# configured inverted in software.
#
# The earlier 4.7k/10k RX divider + D5 startup-kick experiment is NOT needed
# with this transistor RX interface. The transistor interface fixed cold-start
# RX immediately on the tested GWH18.
#
# The component auto-creates the normal GWH18 controls and EXP test switches,
# so the climate block intentionally stays minimal.

esphome:
  name: airco-huiskamer
  friendly_name: "Airco huiskamer"

esp8266:
  board: d1_mini

logger:
  baud_rate: 0
  level: DEBUG

api:
  encryption:
    key: "REPLACE_WITH_YOUR_API_KEY"

ota:
  - platform: esphome
    password: "REPLACE_WITH_YOUR_OTA_PASSWORD"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: ac_uart
  tx_pin:
    number: GPIO1
    inverted: true
  rx_pin:
    number: GPIO3
    inverted: true
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 512

external_components:
  - source:
      type: git
      url: https://github.com/vsebastiaan/esphome_gree_ac
      ref: feature/tosot-v5-full-mapping
    components: [tosot_ac]
    refresh: 0s

climate:
  - platform: tosot_ac
    id: tosot_huiskamer
    name: "Airco huiskamer"
    uart_id: ac_uart

# Auto-created entities:
#   Fan snelheid          Auto / Laag / Midden / Hoog
#   Verticale lamel       Swing / Hoogste / Hoog / Midden / Laag / Laagste
#   Display               Uit / Aan
#   EXP - Turbo
#   EXP - Sleep
#   EXP - X-Fan
#   EXP - Save / Eco
#   EXP - Health / Plasma
#   EXP - Beeper
