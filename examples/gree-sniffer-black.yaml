esphome:
  name: gree-sniffer-black
  friendly_name: "Gree sniffer black"

esp8266:
  board: d1_mini

logger:
  baud_rate: 0
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# RX-only hardware UART on GPIO3. No tx_pin is configured, so this sniffer cannot transmit.
# On a D1 Mini, remove the RX-side 151 resistor that connects the USB-UART TX output to GPIO3.
uart:
  id: sniff_uart
  rx_pin: GPIO3
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 512

external_components:
  - source: github://vsebastiaan/esphome_gree_ac@main
    components: [gree_sniffer]

gree_sniffer:
  id: black_sniffer
  uart_id: sniff_uart
  channel: "BLACK AC-TX -> module-RX"
