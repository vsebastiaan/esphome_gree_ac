name: Fix startup probe frame
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-probe-frame.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix frame
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/gree_uart/gree.cpp')
          s = p.read_text()
          old = '''static const uint8_t STARTUP_0E_CONNECTED[] = {\n    0x7E, 0x7E, 0x0E, 0x03, 0x00, 0x00, 0x00, 0x00, 0x00,\n    0x00, 0x00, 0x00, 0x00, 0x80, 0x7E, 0x0F};'''
          new = '''static const uint8_t STARTUP_0E_CONNECTED[] = {\n    0x7E, 0x7E, 0x0E, 0x03, 0x00, 0x00, 0x00, 0x00, 0x00,\n    0x00, 0x00, 0x00, 0x00, 0x00, 0x80, 0x7E, 0x0F};'''
          if old not in s:
              raise SystemExit('expected frame not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/gree_uart/gree.cpp
          git commit -m 'fix: correct 0x0E connected probe length'
          git push origin main
