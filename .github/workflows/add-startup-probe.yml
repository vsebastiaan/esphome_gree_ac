name: Add Gree startup probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-startup-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch gree_uart startup probe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/gree_uart/gree.cpp')
          s = p.read_text()

          if 'STARTUP_10' not in s:
              marker = 'static const char *const TAG = "gree";\n'
              block = '''\n// Stock Gree Wi-Fi-module startup frames documented by bekmansurov/gree-hvac-protocol.\n// Sent once after boot as a diagnostic probe before normal 0x2C polling.\nstatic const uint8_t STARTUP_10[] = {\n    0x7E, 0x7E, 0x10, 0x02, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,\n    0x01, 0x00, 0x28, 0x1E, 0x19, 0x23, 0x23, 0x00, 0xB8};\nstatic const uint8_t STARTUP_05[] = {0x7E, 0x7E, 0x05, 0x04, 0x07, 0x00, 0x00, 0x10};\nstatic const uint8_t STARTUP_0E_A[] = {\n    0x7E, 0x7E, 0x0E, 0x03, 0x01, 0x00, 0x00, 0x00, 0x00,\n    0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x12};\nstatic const uint8_t STARTUP_0E_B[] = {\n    0x7E, 0x7E, 0x0E, 0x03, 0x01, 0x00, 0x00, 0x00, 0x00,\n    0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7E, 0x90};\nstatic const uint8_t STARTUP_0E_NO_DHCP[] = {\n    0x7E, 0x7E, 0x0E, 0x03, 0x00, 0x00, 0x00, 0x00, 0x00,\n    0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7E, 0x8F};\nstatic const uint8_t STARTUP_0E_CONNECTED[] = {\n    0x7E, 0x7E, 0x0E, 0x03, 0x00, 0x00, 0x00, 0x00, 0x00,\n    0x00, 0x00, 0x00, 0x00, 0x80, 0x7E, 0x0F};\n'''
              if marker not in s:
                  raise SystemExit('TAG marker not found')
              s = s.replace(marker, marker + block, 1)

          old = 'void GreeClimate::loop() {\n  gree_raw_packet_t *raw_packet = (gree_raw_packet_t *)this->data_read_;'
          new = 'void GreeClimate::loop() {\n  this->run_startup_probe_();\n\n  gree_raw_packet_t *raw_packet = (gree_raw_packet_t *)this->data_read_;'
          if old in s:
              s = s.replace(old, new, 1)

          if 'void GreeClimate::run_startup_probe_()' not in s:
              marker = 'void GreeClimate::update() {'
              method = '''void GreeClimate::run_startup_probe_() {\n  if (this->startup_probe_done_) return;\n  const uint32_t now = millis();\n  if (this->startup_probe_next_ms_ == 0) {\n    this->startup_probe_next_ms_ = now + 150;\n    ESP_LOGI(TAG, "Startup probe armed; normal 0x2C polling paused");\n    return;\n  }\n  if (static_cast<int32_t>(now - this->startup_probe_next_ms_) < 0) return;\n\n  const uint8_t *message = nullptr;\n  uint8_t size = 0;\n  const char *label = nullptr;\n  switch (this->startup_probe_step_) {\n    case 0: message = STARTUP_10; size = sizeof(STARTUP_10); label = "0x10"; break;\n    case 1:\n    case 2: message = STARTUP_05; size = sizeof(STARTUP_05); label = "0x05"; break;\n    case 3: message = STARTUP_0E_A; size = sizeof(STARTUP_0E_A); label = "0x0E startup A"; break;\n    case 4: message = STARTUP_0E_B; size = sizeof(STARTUP_0E_B); label = "0x0E startup B"; break;\n    case 5: message = STARTUP_0E_NO_DHCP; size = sizeof(STARTUP_0E_NO_DHCP); label = "0x0E no-DHCP"; break;\n    case 6: message = STARTUP_0E_CONNECTED; size = sizeof(STARTUP_0E_CONNECTED); label = "0x0E connected"; break;\n    default:\n      this->startup_probe_done_ = true;\n      ESP_LOGI(TAG, "Startup probe complete; enabling normal 0x2C polling");\n      return;\n  }\n  ESP_LOGI(TAG, "Startup probe %u/7: %s", this->startup_probe_step_ + 1, label);\n  this->send_data_(message, size);\n  this->startup_probe_step_++;\n  this->startup_probe_next_ms_ = now + (this->startup_probe_step_ >= 7 ? 500 : 300);\n}\n\n'''
              if marker not in s:
                  raise SystemExit('update marker not found')
              s = s.replace(marker, method + marker, 1)

          s = s.replace('void GreeClimate::update() {\n  data_write_[CRC_WRITE]',
                        'void GreeClimate::update() {\n  if (!this->startup_probe_done_) return;\n  data_write_[CRC_WRITE]', 1)

          s = s.replace('void GreeClimate::control(const climate::ClimateCall &call) {\n  data_write_[FORCE_UPDATE] = 175;',
                        'void GreeClimate::control(const climate::ClimateCall &call) {\n  if (!this->startup_probe_done_) {\n    ESP_LOGW(TAG, "Ignoring control request while startup probe is active");\n    return;\n  }\n  data_write_[FORCE_UPDATE] = 175;', 1)

          p.write_text(s)
          PY

      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/gree_uart/gree.cpp
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat: probe stock Gree startup sequence before polling'
          git push origin main
