name: Test Tosot climate

on:
  push:
    branches: [main]
    paths:
      - 'components/tosot_ac/**'
      - 'tests/compile_tosot_ac.yaml'
      - '.github/workflows/test-tosot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'components/tosot_ac/**'
      - 'tests/compile_tosot_ac.yaml'
      - '.github/workflows/test-tosot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ESPHome
        run: python -m pip install esphome==2026.7.4
      - name: Validate Tosot fixture
        run: esphome config tests/compile_tosot_ac.yaml
      - name: Compile Tosot firmware
        run: esphome compile tests/compile_tosot_ac.yaml
