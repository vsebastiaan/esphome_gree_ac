# dialect-probe-v3, passive-sniffer, exact-replay and live-control compile gate
name: Test Gree diagnostics

on:
  push:
    branches: [main, fix/probe-diag-v2, feat/gree-dialect-probe-v3, feat/gree-passive-sniffer]
    paths:
      - 'components/gree_uart/**'
      - 'components/gree_sniffer/**'
      - 'components/gree_replay/**'
      - 'components/sinclair_ac/**'
      - 'tests/**'
      - '.github/workflows/test-gree-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Native diagnostics regression tests (ASan and UBSan)
        run: python tests/test_probe_diagnostics.py
      - name: Install matching ESPHome version
        run: python -m pip install esphome==2026.7.4
      - name: Validate D1 Mini dialect fixture
        run: esphome config tests/compile_gree_uart.yaml
      - name: Compile D1 Mini dialect firmware (no upload)
        run: esphome compile tests/compile_gree_uart.yaml
      - name: Validate D1 Mini passive sniffer fixture
        run: esphome config tests/compile_gree_sniffer.yaml
      - name: Compile D1 Mini passive sniffer firmware (no upload)
        run: esphome compile tests/compile_gree_sniffer.yaml
      - name: Validate D1 Mini exact replay fixture
        run: esphome config tests/compile_gree_replay.yaml
      - name: Compile D1 Mini exact replay firmware (no upload)
        run: esphome compile tests/compile_gree_replay.yaml
      - name: Validate D1 Mini live Sinclair fixture
        run: esphome config tests/compile_sinclair_live.yaml
      - name: Compile D1 Mini live Sinclair firmware (no upload)
        run: esphome compile tests/compile_sinclair_live.yaml
