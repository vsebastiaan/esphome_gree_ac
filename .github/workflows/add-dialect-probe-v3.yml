# retrigger after feature files landed
name: Patch Gree dialect probe v3

on:
  push:
    branches: [feat/gree-dialect-probe-v3]
    paths:
      - '.github/workflows/add-dialect-probe-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch gree.cpp integration points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/gree_uart/gree.cpp')
          s = p.read_text()

          old = (
              "void GreeClimate::loop() {\n"
              "  this->run_startup_probe_();\n"
              "  this->report_startup_probe_();\n\n"
              "  gree_raw_packet_t *raw_packet = (gree_raw_packet_t *)this->data_read_;"
          )
          new = (
              "void GreeClimate::loop() {\n"
              "  if (this->dialect_probe_active_) {\n"
              "    // Research mode owns RX so even partial/non-7E bytes are retained.\n"
              "    this->capture_dialect_probe_rx_();\n"
              "    this->run_dialect_probe_();\n"
              "    return;\n"
              "  }\n\n"
              "  this->run_startup_probe_();\n"
              "  this->report_startup_probe_();\n\n"
              "  gree_raw_packet_t *raw_packet = (gree_raw_packet_t *)this->data_read_;"
          )
          if old in s:
              s = s.replace(old, new, 1)
          elif 'capture_dialect_probe_rx_' not in s:
              raise SystemExit('loop integration marker not found')

          old = (
              "void GreeClimate::update() {\n"
              "  if (!this->startup_probe_done_) return;"
          )
          new = (
              "void GreeClimate::update() {\n"
              "  if (this->dialect_probe_active_) return;\n"
              "  if (!this->startup_probe_done_) return;"
          )
          if old in s:
              s = s.replace(old, new, 1)
          elif 'void GreeClimate::update() {\n  if (this->dialect_probe_active_) return;' not in s:
              raise SystemExit('update integration marker not found')

          old = (
              "void GreeClimate::control(const climate::ClimateCall &call) {\n"
              "  if (!this->startup_probe_done_) {"
          )
          new = (
              "void GreeClimate::control(const climate::ClimateCall &call) {\n"
              "  if (this->dialect_probe_active_) {\n"
              "    ESP_LOGW(TAG, \"Ignoring control request while dialect probe is active\");\n"
              "    return;\n"
              "  }\n"
              "  if (!this->startup_probe_done_) {"
          )
          if old in s:
              s = s.replace(old, new, 1)
          elif 'Ignoring control request while dialect probe is active' not in s:
              raise SystemExit('control integration marker not found')

          p.write_text(s)
          PY
      - name: Commit integration patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/gree_uart/gree.cpp
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat: integrate exhaustive Gree dialect probe'
          git push origin HEAD:feat/gree-dialect-probe-v3
