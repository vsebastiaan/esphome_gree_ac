# Compile-only fixture. Never flash this dummy network configuration.
esphome:
  name: sinclair-live-smoke

esp8266:
  board: d1_mini

logger:
  baud_rate: 0
  level: VERBOSE

api:
  encryption:
    key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

ota:
  - platform: esphome

wifi:
  ssid: "compile-test-not-a-real-network"
  password: "compile-test-password"

uart:
  id: ac_uart
  tx_pin:
    number: GPIO1
    inverted: true
  rx_pin: GPIO3
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 512

external_components:
  - source:
      type: local
      path: ../components
    components: [sinclair_ac]

climate:
  - platform: sinclair_ac
    id: tosot_test
    name: "Tosot test"
    uart_id: ac_uart
