# Compile-only fixture. Never flash this dummy network configuration.
# Normal GWH18 controls are auto-created. The uncertain family-level controls
# are explicitly enabled here only so CI still compiles those optional paths.
esphome:
  name: tosot-ac-smoke

esp8266:
  board: d1_mini

logger:
  baud_rate: 0
  level: VERBOSE

api:
  encryption:
    key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
ota:
  - platform: esphome

wifi:
  ssid: "compile-test-not-a-real-network"
  password: "compile-test-password"

uart:
  id: ac_uart
  tx_pin:
    number: GPIO1
    inverted: true
  rx_pin:
    number: GPIO3
    inverted: true
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 512

external_components:
  - source:
      type: local
      path: ../components
    components: [tosot_ac]

climate:
  - platform: tosot_ac
    id: tosot_test
    name: "Tosot Test"
    uart_id: ac_uart
    xfan_select:
      name: "TEST - X-Fan"
    save_select:
      name: "TEST - Save / Eco"
    plasma_select:
      name: "TEST - Health / Plasma"
    beeper_select:
      name: "TEST - Beeper"
