# Compile-only fixture. Never flash this dummy network configuration.
esphome:
  name: tosot-ac-smoke

esp8266:
  board: d1_mini

logger:
  baud_rate: 0
  level: VERBOSE

api:
  encryption:
    key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
ota:
  - platform: esphome

wifi:
  ssid: "compile-test-not-a-real-network"
  password: "compile-test-password"

uart:
  id: ac_uart
  tx_pin:
    number: GPIO1
    inverted: true
  rx_pin: GPIO3
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 512

external_components:
  - source:
      type: local
      path: ../components
    components: [tosot_ac]

climate:
  - platform: tosot_ac
    id: tosot_test
    name: "Tosot Test"
    uart_id: ac_uart
    kick_pin: GPIO14

    vertical_swing_select:
      name: "Tosot Vertical Louver"
    display_select:
      name: "Tosot Display"

    turbo_switch:
      name: "Tosot Turbo"
    plasma_switch:
      name: "Tosot Health Plasma"
    beeper_switch:
      name: "Tosot Beeper"
    sleep_switch:
      name: "Tosot Sleep"
    xfan_switch:
      name: "Tosot X-Fan"
    save_switch:
      name: "Tosot Save Eco"
