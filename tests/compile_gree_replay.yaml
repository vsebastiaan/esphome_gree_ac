# Compile-only fixture. Never flash this dummy network configuration.
esphome:
  name: gree-replay-smoke

esp8266:
  board: d1_mini

logger:
  baud_rate: 0
  level: INFO

api:
  encryption:
    key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

ota:
  - platform: esphome

wifi:
  ssid: "compile-test-not-a-real-network"
  password: "compile-test-password"

uart:
  id: ac_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 512

external_components:
  - source:
      type: local
      path: ../components
    components: [gree_replay]

gree_replay:
  id: replay_test
  uart_id: ac_uart
  interval: 300ms
